name: Monorepo quality
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**', 'release/**']
  pull_request:
    branches: [main, 'refactor/monorepo-foundation']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p2p:
    name: P2P direct QUIC and signed device binding (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify supported native test platform
        run: |
          test "$(uname -m)" = arm64 || { echo 'NOT RUN: the reviewed native source-build target currently supports arm64'; exit 1; }
          swift --version
      - name: Rebuild fixed native dependency (no remote binary fallback)
        env:
          RUSTUP_TOOLCHAIN: '1.96.0'
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          python3 scripts/rebuild_apple_native.py --jobs 2
      - name: Reject invalid native source and artifact inputs
        run: python3 scripts/test_apple_native_build.py
      - name: Compile isolated normal native QA App (never launch)
        env:
          TOGETHER_NATIVE_ACCEPTANCE: '1'
        run: swift build --package-path apps/apple/macOS --build-path "$RUNNER_TEMP/native-app-build" --product Together
      - name: Normal release launch boundary policy (no App launch)
        run: swift test --package-path apps/apple/macOS --filter ProductionLaunchTests
      - name: Relay-disabled P2P and endpoint authorization
        run: make p2p-test
  macos:
    name: macOS build, Swift, local relay and migration
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/relay/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Relay dependencies
        working-directory: services/relay
        run: npm ci --legacy-peer-deps
      - name: Rebuild fixed native dependency (no remote binary fallback)
        env:
          RUSTUP_TOOLCHAIN: '1.96.0'
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          python3 scripts/rebuild_apple_native.py --jobs 2
      - name: Native QA without desktop automation
        env:
          TOGETHER_QA_PYTHON: python3
        run: |
          set +e
          ./scripts/qa.sh --skip-ui
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then exit "$result"; fi
          python3 scripts/check_ci_report.py
      - name: Retain synthetic QA results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-qa
          path: |
            qa/results/summary.json
            qa/results/copy.json
            qa/results/*.log
          retention-days: 7
  portable:
    name: Relay, protocol, copy and source safety
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/relay/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-qa.txt
      - name: Protocol conformance
        run: python3 -m unittest discover -s tests/conformance -v
      - name: QA tools and publication gate
        run: |
          python3 scripts/test_quality_tools.py
          python3 scripts/test_visual_review.py
          python3 scripts/test_repository_safety.py
          python3 scripts/audit_repository_safety.py --json qa/results/repository-safety.json
      - name: Complete bilingual resources and regression checks
        run: make localization-qa
      - name: Copy audit (warnings remain visible)
        run: python3 scripts/audit_ui_copy.py --json qa/results/copy.json
      - name: Relay typecheck and actual local-runtime tests
        working-directory: services/relay
        run: |
          npm ci --legacy-peer-deps
          npm run check
          npm test
