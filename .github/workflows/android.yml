name: Android clients
on:
  push:
    branches: ['feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: [main, 'feature/localization-0.2.3', 'feature/platform-compatibility', 'feature/iphone-client', 'feature/gitlike-c1-multidevice', 'feature/android-foundation', 'feature/android-business-phase-b', 'feature/native-app-no-vpn-acceptance']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    name: APK, JVM conformance, local C1 and copy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/relay/package-lock.json
      - name: SDK (reuse runner installation)
        run: ./scripts/setup_android_sdk_ci.sh
      - name: Local isolated Relay
        working-directory: services/relay
        run: |
          npm ci --legacy-peer-deps
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8796 --persist-to "$RUNNER_TEMP/android-relay" > "$RUNNER_TEMP/android-relay.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8796/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Native build, exact fixtures and local WebSockets
        env:
          TOGETHER_LOCAL_RELAY_URL: http://127.0.0.1:8796
        run: make android-qa
      - name: Compile isolated native P2P instrumentation (not physical acceptance)
        working-directory: apps/android
        run: ./gradlew :app:assembleDebugAndroidTest --console=plain
      - name: Compile isolated normal native QA App and helper (no device claim)
        working-directory: apps/android
        run: ./gradlew :app:assembleNativeQa :app:assembleNativeQaAndroidTest -Ptogether.testBuildType=nativeQa --dependency-verification=strict --console=plain
      - name: Source publication safety
        run: python3 scripts/audit_repository_safety.py --json qa/results/android-safety.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-client-tests
          path: |
            apps/android/core/**/build/test-results/test/*.xml
            apps/android/app/build/reports/lint-results-debug.xml
            qa/results/android-copy.json
            qa/results/android-safety.json
          retention-days: 7
      # Instrumentation above is compilation-only; local emulator/device results are separate.
      # Emulator/TalkBack/physical phone and Mac↔Android UI are not claimed by this job.
  native-interop:
    name: Swift–Kotlin business and original-media C1
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: apps/android/**/*.gradle.kts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/relay/package-lock.json
      - name: Compile Swift bridge tests before the timed synchronization session
        # A clean hosted runner can take longer than the interoperability
        # startup deadline to compile. Keep compilation outside that deadline;
        # all existing peer/ACK/media waits and assertions remain unchanged.
        run: swift build --package-path packages/together-core-swift --build-tests
      - name: Local isolated Relay
        working-directory: services/relay
        run: |
          npm ci --legacy-peer-deps
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8797 --persist-to "$RUNNER_TEMP/android-business-relay" > "$RUNNER_TEMP/android-business-relay.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8797/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Independent native and JVM clients
        env:
          TOGETHER_LOCAL_RELAY_URL: http://127.0.0.1:8797
          TOGETHER_RUN_SWIFT_ANDROID: '1'
        run: apps/android/gradlew -p apps/android -Ptogether.jvmOnly=true :core:domain:test --tests com.together.domain.NativeBridgeIntegrationTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-business-native-conformance
          path: |
            apps/android/core/domain/build/test-results/test/*.xml
            qa/results/android-phase-b/native-result.json
            qa/results/android-phase-b/native-bridge.log
            qa/results/android-phase-b/native-diagnostic.json
          retention-days: 7
      # This job is native/JVM interop; it does not claim a phone, emulator UI or independent security review.

  android-release:
    name: Clean signed Release and 16KiB native artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: apps/android/**/*.gradle.kts
      - name: SDK
        run: ./scripts/setup_android_sdk_ci.sh
      - name: Native compatibility and provenance regression gates
        run: python3 scripts/test_android_native_build.py
      - name: Native toolchain
        run: |
          sdkmanager --install 'ndk;28.2.13676358'
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-linux-android
          rustup target add --toolchain 1.96.0 armv7-linux-androideabi
      - name: Rebuild the exact upstream ARM64 and ARMv7 source at API 24
        env:
          RUSTUP_TOOLCHAIN: '1.96.0'
        run: |
          mkdir -p qa/results/native-release-ci
          git clone --filter=blob:none --no-checkout https://github.com/n0-computer/iroh-ffi.git qa/results/native-release-ci/iroh-ffi
          git -C qa/results/native-release-ci/iroh-ffi checkout --detach 5e451092dba0c1a09ee83ff6e5be37b1152a5c58
          curl -fL --retry 2 https://repo.maven.apache.org/maven2/computer/iroh/iroh-android/1.1.0/iroh-android-1.1.0.aar \
            -o qa/results/native-release-ci/original.aar
          python3 scripts/rebuild_android_native.py \
            --source qa/results/native-release-ci/iroh-ffi \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
            --original-aar qa/results/native-release-ci/original.aar \
            --output qa/results/native-release-ci/iroh-16k.aar \
            --android-api 24 --abi arm64-v8a --abi armeabi-v7a --jobs 4
      - name: Optimized Release with an ephemeral CI-only signing key
        working-directory: apps/android
        run: |
          umask 077
          task_sign_dir="$RUNNER_TEMP/together-ci-signing"
          mkdir -p "$task_sign_dir"
          openssl rand -hex 32 > "$task_sign_dir/password.txt"
          keytool -genkeypair -alias ci-only -keyalg RSA -keysize 3072 -validity 2 \
            -storetype PKCS12 -keystore "$task_sign_dir/ci-only.p12" \
            -storepass:file "$task_sign_dir/password.txt" -keypass:file "$task_sign_dir/password.txt" \
            -dname 'CN=Together CI test only' -noprompt
          TASK_SIGN_DIR="$task_sign_dir" python3 - <<'PYCONFIG'
          import os
          from pathlib import Path
          base = Path(os.environ['TASK_SIGN_DIR'])
          password = (base / 'password.txt').read_text().strip()
          (base / 'signing.properties').write_text(
              f'storeFile={base / "ci-only.p12"}\nstorePassword={password}\n'
              f'keyAlias=ci-only\nkeyPassword={password}\n')
          PYCONFIG
          task_native_dir="$(cd ../../qa/results/native-release-ci && pwd)"
          task_native_sha="$(sha256sum "$task_native_dir/iroh-16k.aar" | cut -d ' ' -f 1)"
          ./gradlew :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest \
            -Ptogether.nativeReleaseAar="$task_native_dir/iroh-16k.aar" \
            -Ptogether.nativeReleaseAarSha256="$task_native_sha" \
            -Ptogether.signingProperties="$task_sign_dir/signing.properties" \
            --dependency-verification=strict --console=plain
          # Never upload this CI-only APK or use this key as a production credential.
      - name: Verify the actual optimized APK
        run: |
          python3 scripts/test_release_delivery.py \
            --android-apk apps/android/app/build/outputs/apk/release/app-release.apk \
            --json qa/results/native-release-ci/artifact.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-release-verification
          path: |
            qa/results/native-release-ci/*.json
            apps/android/app/build/reports/lint-results-release.xml
          retention-days: 7
      # Ephemeral CI key/APK are never public distribution artifacts.
